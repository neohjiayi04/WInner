<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Assessment — SME Growth Advisor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<style>
:root{
  --blue-700:#1d4ed8;
  --blue-600:#2563eb;
  --blue-500:#3b82f6;
  --blue-100:#dbeafe;
  --blue-50:#eff6ff;
  --navy-900:#0f172a;
  --slate-600:#475569;
  --slate-500:#64748b;
  --slate-200:#e2e8f0;
  --slate-100:#f1f5f9;
  --bg:#f5f7fb;
  --danger:#dc2626;
}
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Inter', system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--navy-900);
  -webkit-font-smoothing:antialiased;
}
/* ---------- BUTTONS ---------- */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:.75em 1.5em;
  border-radius:999px;
  font-family:inherit;
  font-weight:700;
  font-size:14px;
  border:1px solid transparent;
  cursor:pointer;
  transition:.15s ease;
  text-decoration:none;
}

.btn-sm{ padding:.5em 1.1em; font-size:13px; }

.btn-primary{
  background:var(--blue-600);
  color:#fff;
}

.btn-primary:hover{ background:var(--blue-700); }

.btn-outline{
  background:#fff;
  border-color:var(--slate-200);
  color:var(--navy-900);
}

.btn-outline:hover{
  border-color:var(--blue-600);
  color:var(--blue-600);
}

/* ---------- APP SHELL ---------- */

.app-shell{
  max-width:1180px;
  margin:0 auto;
  padding:32px 24px 90px;
  display:grid;
  grid-template-columns:250px 1fr;
  gap:44px;
  align-items:start;
}

/* ---------- SIDE NAV / STEPPER ---------- */

.side-nav{
  position:sticky;
  top:96px;
  display:flex;
  flex-direction:column;
}

.nav-step{
  position:relative;
  display:flex;
  gap:14px;
  padding-bottom:34px;
}

.nav-step:last-child{ padding-bottom:0; }

.nav-step::after{
  content:'';
  position:absolute;
  left:15px;
  top:32px;
  bottom:-34px;
  width:2px;
  background:var(--slate-200);
}

.nav-step:last-child::after{ display:none; }

.nav-step.completed::after{ background:var(--blue-600); }

.nav-circle{
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--slate-200);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  color:var(--slate-500);
  position:relative;
  z-index:1;
  transition:.2s ease;
}

.nav-step.active .nav-circle{
  border-color:var(--blue-600);
  color:var(--blue-600);
  box-shadow:0 0 0 4px var(--blue-100);
}

.nav-step.completed .nav-circle{
  background:var(--blue-600);
  border-color:var(--blue-600);
  color:#fff;
}

.nav-label{
  padding-top:5px;
  font-size:14px;
  font-weight:600;
  color:var(--slate-500);
}

.nav-step.active .nav-label,
.nav-step.completed .nav-label{
  color:var(--navy-900);
}

.nav-step.clickable{ cursor:pointer; }

.nav-step.clickable:hover .nav-circle{ transform:scale(1.08); }

.nav-step:not(.clickable){ opacity:.55; }

/* ---------- MAIN COLUMN ---------- */

.app-main{ min-width:0; }

.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--blue-600);
}

.step-title{
  font-size:28px;
  font-weight:800;
  margin:6px 0 8px;
}

.step-subtitle{
  color:var(--slate-600);
  font-size:14px;
  max-width:600px;
  margin:0 0 24px;
}

.step-grid{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:24px;
  align-items:start;
}

.question-card,
.score-card{
  background:#fff;
  border:1px solid var(--slate-200);
  border-radius:16px;
  padding:28px;
}

.score-card{ position:sticky; top:96px; }

.score-card h3{
  font-size:14px;
  font-weight:700;
  margin:0 0 18px;
}

/* ---------- FIELDS ---------- */

.field{ margin-bottom:26px; }
.field:last-child{ margin-bottom:0; }

.field > label{
  display:block;
  font-size:14px;
  font-weight:600;
  color:var(--navy-900);
  margin-bottom:10px;
}

.error-message{
  display:none;
  color:var(--danger);
  font-size:12px;
  margin-top:8px;
}

.field.error .error-message{ display:block; }

.field.error .pill-group{
  outline:1.5px solid var(--danger);
  outline-offset:4px;
  border-radius:12px;
}

.pill-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.pill-btn{
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--slate-200);
  background:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  color:var(--navy-900);
  cursor:pointer;
  transition:.15s ease;
}

.pill-btn:hover{ border-color:var(--blue-600); }

.pill-btn.selected{
  background:var(--blue-600);
  border-color:var(--blue-600);
  color:#fff;
}

.checkbox-grid{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.checkbox-option{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  color:var(--navy-900);
  cursor:pointer;
}

.checkbox-option input{
  accent-color:var(--blue-600);
  width:16px;
  height:16px;
}

/* Sliders */

.slider-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  margin-bottom:12px;
}

.slider-head label{ margin-bottom:0; }

.slider-value{
  font-size:13px;
  font-weight:700;
  color:var(--blue-600);
  white-space:nowrap;
}

.slider-field.unrated .slider-value{ color:var(--slate-500); }

.slider-input{
  width:100%;
  accent-color:var(--blue-600);
  height:6px;
  cursor:pointer;
}

.slider-field.unrated .slider-input{ opacity:.45; }

.slider-scale{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:11px;
  color:var(--slate-500);
}

.slider-scale span{ max-width:70px; text-align:center; }
.slider-scale span:first-child{ text-align:left; }
.slider-scale span:last-child{ text-align:right; }

/* ---------- SCORE PANEL ---------- */

.score-empty{
  font-size:13px;
  color:var(--slate-500);
  line-height:1.6;
  margin:0;
}

.score-ring-wrap{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 22px;
}

.score-ring{
  width:120px;
  height:120px;
  transform:rotate(-90deg);
}

.ring-bg{ fill:none; stroke:var(--slate-100); stroke-width:10; }

.ring-fg{
  fill:none;
  stroke:var(--blue-600);
  stroke-width:10;
  stroke-linecap:round;
  transition:stroke-dashoffset .4s ease;
}

.score-ring-label{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.score-num{ font-size:26px; font-weight:800; }
.score-den{ font-size:11px; color:var(--slate-500); }

.score-breakdown{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.score-row-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  margin-bottom:5px;
}

.score-row-label{ color:var(--slate-600); }
.score-row-val{ font-weight:700; color:var(--navy-900); }

.score-row-bar{
  display:block;
  height:6px;
  background:var(--slate-100);
  border-radius:999px;
  overflow:hidden;
}

.score-row-bar span{
  display:block;
  height:100%;
  background:var(--blue-600);
  border-radius:999px;
}

/* ---------- REVIEW STEP ---------- */

.review-section{
  border-bottom:1px solid var(--slate-200);
  padding-bottom:20px;
  margin-bottom:20px;
}

.review-section:last-of-type{ border-bottom:none; margin-bottom:0; }

.review-section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.review-section-head h3{
  font-size:15px;
  font-weight:700;
  margin:0;
}

.review-edit-btn{
  background:none;
  border:none;
  color:var(--blue-600);
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  padding:4px 8px;
  border-radius:6px;
  font-family:inherit;
}

.review-edit-btn:hover{ background:var(--blue-50); }

.review-item{
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:8px 0;
  font-size:14px;
}

.review-label{ color:var(--slate-500); }
.review-value{ font-weight:600; color:var(--navy-900); text-align:right; }

/* ---------- NAV ACTIONS ---------- */

.step-nav-actions{
  display:flex;
  justify-content:space-between;
  margin-top:28px;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 900px){
  .app-shell{ grid-template-columns:1fr; }
  .step-grid{ grid-template-columns:1fr; }
  .score-card{ position:static; }

  .side-nav{
    position:static;
    flex-direction:row;
    flex-wrap:wrap;
    gap:18px 26px;
  }

  .nav-step{ padding-bottom:0; }
  .nav-step::after{ display:none; }
}

@media (max-width: 600px){
  .step-nav-actions{ flex-direction:column-reverse; gap:10px; }
  .step-nav-actions .btn{ width:100%; }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark" data-icon="logo"></span>
      <span>SME<span class="brand-sub">GROWTH ADVISOR</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html" >Home</a>
      <a href="#how-it-works">How It Works</a>
      <a href="assessment.html" class="active">Assessment</a>
      <a href="aboutus.html">About Us</a>
      <a href="faq.html">FAQ</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      <button class="nav-toggle" aria-label="Menu" data-icon="menu"></button>
    </div>
  </div>
</header>

<section class="about-hero">
  <div class="wrap">
    <h1>Assess Your Business in Minutes</h1>
    <p class="lead">Answer a few simple questions — including your AI readiness — and get your personalised growth score.</p>
  </div>
</section>

<div class="app-shell">

  <aside class="side-nav" id="sideNav"></aside>

  <main class="app-main">

    <span class="eyebrow" id="stepEyebrow"></span>
    <h1 class="step-title" id="stepTitle"></h1>
    <p class="step-subtitle" id="stepSubtitle"></p>

    <div class="step-grid">
      <div class="question-card" id="questionCard"></div>
      <div class="score-card" id="scoreCard"></div>
    </div>

    <div class="step-nav-actions">
      <button type="button" class="btn btn-outline" id="backBtn">← Back</button>
      <button type="button" class="btn btn-primary" id="nextBtn">Next →</button>
    </div>

  </main>

</div>

<script>

/* ========================================
   STEP + FIELD CONFIGURATION
   Each field is either:
     - pills:       single choice, tap to select
     - checkboxes:  multi choice
     - slider:      1..N ordinal rating, drives the live score
======================================== */

const steps = [
  {
    id: 1,
    label: "About Your Business",
    eyebrow: "01 · YOUR BUSINESS",
    title: "Tell us about your business",
    subtitle: "Some basic facts so we can tailor everything that follows.",
    fields: [
      { name: "industry", label: "Industry", type: "pills", required: true,
        options: ["Manufacturing","Retail & E-commerce","Food & Beverage","Professional Services","Construction","Technology","Healthcare","Tourism & Hospitality","Other"] },
      { name: "yearEstablished", label: "Year Established", type: "pills", required: true,
        options: ["Less than 1 year","1 – 5 years","6 – 10 years","More than 10 years"] },
      { name: "employees", label: "Number of Employees", type: "pills", required: true,
        options: ["1 - 5","6 - 20","21 - 50","51 - 200","200+"] },
      { name: "revenue", label: "Annual Revenue", type: "pills", required: true,
        options: ["Below RM500K","RM500K - RM2M","RM2M - RM10M","Above RM10M"] },
      { name: "location", label: "Business Location", type: "pills", required: true,
        options: ["Selangor","Kuala Lumpur","Penang","Johor","Melaka","Perak","Kedah","Sabah","Sarawak","Other"] },
      { name: "businessModel", label: "Primary Business Model", type: "pills", required: true,
        options: ["B2B","B2C","B2B2C","Others"] },
      { name: "goal", label: "Main Growth Objective", type: "pills", required: true,
        options: ["Increase revenue","Improve efficiency","Digitalise operations","Expand to new markets","Strengthen team & capability"] }
    ]
  },
  {
    id: 2,
    label: "Business Operations",
    eyebrow: "02 · OPERATIONS",
    title: "How does the business run today?",
    subtitle: "Rate each factor honestly — this feeds directly into your live score.",
    fields: [
      { name: "operationalEfficiency", label: "Current operational efficiency", type: "slider", min: 1, max: 5,
        scaleLabels: ["Very Low","Low","Average","Good","Excellent"] },
      { name: "teamCollaboration", label: "How well does your team collaborate?", type: "slider", min: 1, max: 5,
        scaleLabels: ["Poorly","Below Average","Average","Well","Very Well"] },
      { name: "dataTracking", label: "Do you track business performance using data?", type: "slider", min: 1, max: 4,
        scaleLabels: ["Never","Occasionally","Regularly","Extensively"] },
      { name: "challenges", label: "Biggest operational challenges", type: "checkboxes",
        options: ["Manual processes","High costs","Staff shortage","Poor communication","Data management"] }
    ]
  },
  {
    id: 3,
    label: "Digitalisation",
    eyebrow: "03 · DIGITALISATION",
    title: "How digital is the business today?",
    subtitle: "",
    fields: [
      { name: "digitalLevel", label: "Current digitalisation level", type: "slider", min: 1, max: 4,
        scaleLabels: ["Mostly Manual","Basic Digital Tools","Partially Digitalised","Highly Digitalised"] },
      { name: "digitalTools", label: "Digital tools currently in use", type: "checkboxes",
        options: ["Cloud software","E-commerce","CRM","Accounting software","AI","None"] },
      { name: "digitalBarrier", label: "Biggest barrier to digitalisation", type: "pills",
        options: ["Cost","Lack of Knowledge","Lack of Skills","Resistance to Change"] },
      { name: "aiInterest", label: "Interest in implementing AI", type: "slider", min: 1, max: 4,
        scaleLabels: ["Not Interested","Slightly Interested","Interested","Very Interested"] }
    ]
  },
  {
    id: 4,
    label: "AI Readiness",
    eyebrow: "04 · AI READINESS SCORE",
    title: "Is the business ready for AI?",
    subtitle: "Digital maturity and AI readiness are different things — rate each factor honestly.",
    fields: [
      { name: "leadershipBuyIn", label: "Leadership buy-in for change", type: "slider", min: 1, max: 5 },
      { name: "dataAvailability", label: "Data availability & organisation", type: "slider", min: 1, max: 5 },
      { name: "staffDigitalSkills", label: "Staff digital skills", type: "slider", min: 1, max: 5 },
      { name: "digitalWorkflowMaturity", label: "Digital workflow maturity", type: "slider", min: 1, max: 5 },
      { name: "processDocumentationMaturity", label: "Process documentation maturity", type: "slider", min: 1, max: 5 }
    ]
  },
  {
    id: 5,
    label: "Growth & Strategy",
    eyebrow: "05 · GROWTH & STRATEGY",
    title: "Where is the business headed?",
    subtitle: "",
    fields: [
      { name: "growthChallenge", label: "Biggest growth challenge", type: "pills",
        options: ["Finding Customers","Increasing Revenue","Scaling Operations","Hiring Talent","Market Competition"] },
      { name: "growthStrategy", label: "Do you have a clear growth strategy?", type: "slider", min: 1, max: 4,
        scaleLabels: ["No Clear Strategy","Basic Plan","Clear Strategy","Highly Structured Strategy"] },
      { name: "futureGoal", label: "Where do you see the business in 3 years?", type: "pills",
        options: ["Stable Growth","National Expansion","International Expansion","New Products & Services"] },
      { name: "advisorInterest", label: "Interested in expert business advice?", type: "pills",
        options: ["Yes","Maybe","Not Currently"] }
    ]
  },
  {
    id: 6,
    label: "Review & Submit",
    eyebrow: "06 · REVIEW",
    title: "Review your assessment",
    subtitle: "Check everything below, then generate your results. Tap \"Edit\" to jump back to any section.",
    isReview: true
  }
];

const totalSteps = steps.length;

/* ========================================
   STATE
======================================== */

let currentStep = 1;
let maxStepReached = 1;

const assessmentData = {};
const touched = new Set(); // slider fields the user has actually interacted with

/* ========================================
   DOM REFS
======================================== */

const sideNav = document.getElementById("sideNav");
const questionCard = document.getElementById("questionCard");
const scoreCard = document.getElementById("scoreCard");
const stepEyebrow = document.getElementById("stepEyebrow");
const stepTitle = document.getElementById("stepTitle");
const stepSubtitle = document.getElementById("stepSubtitle");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

/* ========================================
   SIDE NAV
======================================== */

sideNav.innerHTML = steps.map(s => `
  <div class="nav-step" data-step="${s.id}">
    <div class="nav-circle">${s.id}</div>
    <div class="nav-label">${s.label}</div>
  </div>
`).join("");

sideNav.addEventListener("click", e => {

  const stepEl = e.target.closest(".nav-step");
  if (!stepEl) return;

  const target = Number(stepEl.dataset.step);

  if (target === currentStep || target > maxStepReached) return;

  currentStep = target;
  renderCurrentStep();

});

function updateSideNav() {

  sideNav.querySelectorAll(".nav-step").forEach(el => {

    const n = Number(el.dataset.step);
    const circle = el.querySelector(".nav-circle");

    el.classList.remove("active", "completed", "clickable");
    circle.textContent = n;

    if (n < currentStep) {
      el.classList.add("completed");
      circle.textContent = "✓";
    } else if (n === currentStep) {
      el.classList.add("active");
    }

    if (n <= maxStepReached) {
      el.classList.add("clickable");
    }

  });

}

/* ========================================
   FIELD RENDERING
======================================== */

function renderField(field) {

  if (field.type === "pills") {

    return `
      <div class="field" data-field="${field.name}">
        <label>${field.label}</label>
        <div class="pill-group" data-name="${field.name}">
          ${field.options.map(o => `<button type="button" class="pill-btn">${o}</button>`).join("")}
        </div>
        <div class="error-message">Please select an option.</div>
      </div>
    `;

  }

  if (field.type === "checkboxes") {

    return `
      <div class="field" data-field="${field.name}">
        <label>${field.label}</label>
        <div class="checkbox-grid">
          ${field.options.map(o => `
            <label class="checkbox-option">
              <input type="checkbox" name="${field.name}" value="${o}">
              ${o}
            </label>
          `).join("")}
        </div>
      </div>
    `;

  }

  if (field.type === "slider") {

    const scale = field.scaleLabels
      ? `<div class="slider-scale">${field.scaleLabels.map(l => `<span>${l}</span>`).join("")}</div>`
      : `<div class="slider-scale"><span>${field.min}</span><span>${field.max}</span></div>`;

    return `
      <div class="field slider-field unrated" data-field="${field.name}">
        <div class="slider-head">
          <label>${field.label}</label>
          <span class="slider-value" data-value-for="${field.name}">Not yet rated</span>
        </div>
        <input type="range" class="slider-input" data-name="${field.name}" min="${field.min}" max="${field.max}" step="1" value="${field.min}">
        ${scale}
      </div>
    `;

  }

  return "";

}

function sliderDisplayValue(field, value) {
  return field.scaleLabels ? field.scaleLabels[value - field.min] : `${value} / ${field.max}`;
}

/* ========================================
   RENDER A STEP
======================================== */

function renderCurrentStep() {

  const step = steps.find(s => s.id === currentStep);

  stepEyebrow.textContent = step.eyebrow;
  stepTitle.textContent = step.title;
  stepSubtitle.textContent = step.subtitle || "";
  stepSubtitle.style.display = step.subtitle ? "block" : "none";

  if (step.isReview) {
    questionCard.innerHTML = renderReview();
    attachReviewListeners();
  } else {
    questionCard.innerHTML = step.fields.map(renderField).join("");
    attachFieldListeners(step);
    restoreFieldValues(step);
  }

  updateSideNav();
  updateScoreCard();

  backBtn.style.display = currentStep === 1 ? "none" : "inline-flex";

  nextBtn.textContent = currentStep === totalSteps
    ? "Generate My Results →"
    : `Next: ${steps[currentStep].label} →`;

  window.scrollTo({ top: 0, behavior: "smooth" });

}

function attachFieldListeners(step) {

  questionCard.querySelectorAll(".pill-group").forEach(group => {

    const name = group.dataset.name;

    group.querySelectorAll(".pill-btn").forEach(btn => {

      btn.addEventListener("click", function() {

        group.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("selected"));
        this.classList.add("selected");

        assessmentData[name] = this.textContent.trim();
        group.closest(".field").classList.remove("error");

        updateScoreCard();

      });

    });

  });

  questionCard.querySelectorAll("input[type='checkbox'][name]").forEach(input => {

    input.addEventListener("change", function() {

      const name = this.name;

      if (!assessmentData[name]) assessmentData[name] = [];

      if (this.checked) {
        if (!assessmentData[name].includes(this.value)) assessmentData[name].push(this.value);
      } else {
        assessmentData[name] = assessmentData[name].filter(v => v !== this.value);
      }

      updateScoreCard();

    });

  });

  questionCard.querySelectorAll(".slider-input").forEach(input => {

    const name = input.dataset.name;
    const field = step.fields.find(f => f.name === name);

    input.addEventListener("input", function() {

      touched.add(name);
      assessmentData[name] = Number(this.value);

      this.closest(".slider-field").classList.remove("unrated");

      questionCard.querySelector(`[data-value-for="${name}"]`).textContent =
        sliderDisplayValue(field, Number(this.value));

      updateScoreCard();

    });

  });

}

function restoreFieldValues(step) {

  step.fields.forEach(f => {

    if (f.type === "pills") {

      const val = assessmentData[f.name];
      if (!val) return;

      questionCard.querySelectorAll(`.pill-group[data-name="${f.name}"] .pill-btn`).forEach(btn => {
        if (btn.textContent.trim() === val) btn.classList.add("selected");
      });

    } else if (f.type === "checkboxes") {

      const vals = assessmentData[f.name] || [];

      questionCard.querySelectorAll(`input[name="${f.name}"]`).forEach(input => {
        input.checked = vals.includes(input.value);
      });

    } else if (f.type === "slider" && touched.has(f.name)) {

      const input = questionCard.querySelector(`.slider-input[data-name="${f.name}"]`);
      input.value = assessmentData[f.name];
      input.closest(".slider-field").classList.remove("unrated");

      questionCard.querySelector(`[data-value-for="${f.name}"]`).textContent =
        sliderDisplayValue(f, assessmentData[f.name]);

    }

  });

}

/* ========================================
   LIVE SCORE PANEL
   Aggregates every slider answered so far,
   anywhere in the form.
======================================== */

function getAllSliderFields() {
  return steps.flatMap(s => s.fields ? s.fields.filter(f => f.type === "slider") : []);
}

function computeScore() {

  const answered = getAllSliderFields().filter(f => touched.has(f.name));
  if (answered.length === 0) return null;

  const total = answered.reduce((sum, f) => sum + (assessmentData[f.name] - f.min) / (f.max - f.min), 0);

  return Math.round((total / answered.length) * 100);

}

function updateScoreCard() {

  const score = computeScore();
  const answered = getAllSliderFields().filter(f => touched.has(f.name));

  if (score === null) {

    scoreCard.innerHTML = `
      <h3>Your Live Score</h3>
      <p class="score-empty">Your growth &amp; AI readiness score will build up here as you rate your business, starting in Business Operations.</p>
    `;

    return;

  }

  const circumference = 2 * Math.PI * 52;

  scoreCard.innerHTML = `
    <h3>Your Live Score</h3>
    <div class="score-ring-wrap">
      <svg viewBox="0 0 120 120" class="score-ring">
        <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
        <circle cx="60" cy="60" r="52" class="ring-fg"
          style="stroke-dasharray:${circumference};stroke-dashoffset:${circumference * (1 - score / 100)};">
        </circle>
      </svg>
      <div class="score-ring-label">
        <span class="score-num">${score}</span>
        <span class="score-den">/ 100</span>
      </div>
    </div>
    <div class="score-breakdown">
      ${answered.map(f => {
        const pct = ((assessmentData[f.name] - f.min) / (f.max - f.min)) * 100;
        return `
          <div class="score-row">
            <div class="score-row-top">
              <span class="score-row-label">${f.label}</span>
              <span class="score-row-val">${assessmentData[f.name]}/${f.max}</span>
            </div>
            <span class="score-row-bar"><span style="width:${pct}%"></span></span>
          </div>
        `;
      }).join("")}
    </div>
  `;

}

/* ========================================
   REVIEW STEP
======================================== */

function renderReview() {

  const sections = steps.filter(s => !s.isReview).map(s => `
    <div class="review-section">
      <div class="review-section-head">
        <h3>${s.label}</h3>
        <button type="button" class="review-edit-btn" data-jump="${s.id}">Edit</button>
      </div>
      ${s.fields.map(reviewRow).join("")}
    </div>
  `).join("");

  return `
    ${sections}
    <div class="field">
      <label class="checkbox-option">
        <input type="checkbox" id="consent">
        I agree to the processing of my information to receive personalised business insights.
      </label>
    </div>
  `;

}

function reviewRow(f) {

  let value;

  if (f.type === "checkboxes") {
    value = (assessmentData[f.name] || []).join(", ");
  } else if (f.type === "slider") {
    value = touched.has(f.name) ? sliderDisplayValue(f, assessmentData[f.name]) : "";
  } else {
    value = assessmentData[f.name];
  }

  return `
    <div class="review-item">
      <span class="review-label">${f.label}</span>
      <span class="review-value">${value || "Not provided"}</span>
    </div>
  `;

}

function attachReviewListeners() {

  questionCard.querySelectorAll(".review-edit-btn").forEach(btn => {

    btn.addEventListener("click", function() {
      currentStep = Number(this.dataset.jump);
      renderCurrentStep();
    });

  });

}

/* ========================================
   VALIDATION
======================================== */

function validateStep(step) {

  let isValid = true;

  questionCard.querySelectorAll(".field").forEach(f => f.classList.remove("error"));

  if (step.fields) {

    step.fields.forEach(f => {

      if (f.required && f.type === "pills" && !assessmentData[f.name]) {

        questionCard.querySelector(`.pill-group[data-name="${f.name}"]`)
          .closest(".field")
          .classList.add("error");

        isValid = false;

      }

    });

  }

  if (step.isReview) {

    const consent = document.getElementById("consent");

    if (!consent.checked) {
      alert("Please agree to the processing of your information before continuing.");
      isValid = false;
    }

  }

  if (!isValid) {
    questionCard.querySelector(".field.error")?.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  return isValid;

}

/* ========================================
   NAVIGATION
======================================== */

nextBtn.addEventListener("click", () => {

  const step = steps.find(s => s.id === currentStep);

  if (!validateStep(step)) return;

  if (currentStep < totalSteps) {
    currentStep++;
    maxStepReached = Math.max(maxStepReached, currentStep);
    renderCurrentStep();
  } else {
    submitAssessment();
  }

});

backBtn.addEventListener("click", () => {

  if (currentStep > 1) {
    currentStep--;
    renderCurrentStep();
  }

});

/* ========================================
   SUBMIT
======================================== */

function submitAssessment() {

  localStorage.setItem("smeAssessment", JSON.stringify(assessmentData));
  window.location.href = "results.html";

}

/* ========================================
   INIT
======================================== */

renderCurrentStep();

</script>

</body>
</html>
